# Ontology Sources Configuration
# Format: source.<name>.<property>=<value>

# Schema.org
source.schema-org.name=Schema.org
source.schema-org.url=https://schema.org/version/latest/schemaorg-current-https.rdf
source.schema-org.format=rdf/xml
source.schema-org.updateFrequencyDays=7
source.schema-org.enabled=true
source.schema-org.description=Schema.org vocabulary for structured data on the web

# GoodRelations v1
source.goodrelations.name=GoodRelations
source.goodrelations.url=http://purl.org/goodrelations/v1
source.goodrelations.format=rdf/xml
source.goodrelations.updateFrequencyDays=7
source.goodrelations.enabled=true
source.goodrelations.description=GoodRelations vocabulary for e-commerce

# FOAF (Friend of a Friend)
source.foaf.name=FOAF
source.foaf.url=http://xmlns.com/foaf/0.1/
source.foaf.format=rdf/xml
source.foaf.updateFrequencyDays=7
source.foaf.enabled=true
source.foaf.description=Friend of a Friend vocabulary for describing people and relationships

# Dublin Core Terms
source.dcterms.name=Dublin Core Terms
source.dcterms.url=http://purl.org/dc/terms/
source.dcterms.format=rdf/xml
source.dcterms.updateFrequencyDays=7
source.dcterms.enabled=true
source.dcterms.description=Dublin Core metadata terms vocabulary

# Dublin Core Elements
source.dcelements.name=Dublin Core Elements
source.dcelements.url=http://purl.org/dc/elements/1.1/
source.dcelements.format=rdf/xml
source.dcelements.updateFrequencyDays=7
source.dcelements.enabled=true
source.dcelements.description=Dublin Core metadata elements vocabulary
